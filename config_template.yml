log:
  path: "ml-malware-attribution/debug.log"
  mode: ["file", "stream", "journal"]
  logger: {}
  level: "DEBUG"
neo4j:
  uri: "neo4j://localhost:7687"
  user: "neo4j"
  password: "password"
  http_uri: "http://localhost:7474"   # HTTP endpoint polled to check Neo4j is up
  startup_timeout: 60                 # seconds to wait for Neo4j before giving up
features_cache:
  filename: "cached_features.pkl"
  save: true
  load: false
sampling:
  do_sampling: True
  modulo: 1
redis:
  host: "localhost"
  port: 6379
  db: 0
hnsw:
  dimension: 128
  max_elements: 1000000
model:
  # One of: LSH_Model, KMeans_Model, KMeans_Model_Unsupervised,
  #         Agglomerative_Model, DBSCAN_Model, HDBSCAN_Model
  default: "LSH_Model"
  threshold: 0.6                 # LSH_Model: Jaccard threshold for a SIMILAR edge
  n_clusters: 30                 # KMeans_Model / Agglomerative_Model
  k_min: 2                       # KMeans_Model_Unsupervised: silhouette search range
  k_max: 10
  dbscan_eps: 0.5                # DBSCAN_Model: max Jaccard distance within a cluster
  dbscan_min_samples: 2          # DBSCAN_Model: min samples to form a dense region
  hdbscan_min_cluster_size: 2    # HDBSCAN_Model: smallest cluster size
clustering:
  hash_dim: 16384                # hashing-trick dimension for the clustering feature matrix
samples:
  directory: "SAMPLES/APT1_MALWARE_FAMILIES/"
database:
  redis: false